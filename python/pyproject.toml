[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "namu-ai"
dynamic = ["version"]
description = "The Namu API for Python: speech recognition, speech synthesis and translation for Hausa, Zarma and French."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Namu AI Lab", email = "contact@namuai.org" }]
keywords = ["namu", "speech", "text-to-speech", "speech-to-text", "translation", "hausa", "zarma", "french", "sahel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]
dependencies = [
  "requests>=2.28,<3",
  "typing_extensions>=4.5; python_version<'3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://www.namuai-lab.com/api"
Documentation = "https://www.namuai-lab.com/docs"

[tool.hatch.version]
path = "src/namu/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/namu"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real API (only the endpoints that need no key); run with NAMU_LIVE=1"]
