# Publishes a package when its version tag is pushed: python-vX.Y.Z to PyPI, js-vX.Y.Z to npm.
# Trusted publishing: no long-lived tokens (see README, "Publish").
name: Release

on:
  push:
    tags: ["python-v*", "js-v*"]

permissions:
  contents: read

jobs:
  pypi:
    if: startsWith(github.ref_name, 'python-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" && pytest
      - name: The tag matches the package version
        run: test "python-v$(python -c 'import namu; print(namu.__version__)')" = "${GITHUB_REF_NAME}"
      - run: python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist

  npm:
    if: startsWith(github.ref_name, 'js-v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci && npm test
      - name: The tag matches the package version
        run: test "js-v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
